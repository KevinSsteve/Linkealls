    <script>
      (() => {
        if (!/^\/e\/[^/]+$/.test(window.location.pathname)) return;

        try {
          history.scrollRestoration = "manual";
        } catch {}

        let userInteracted = false;
        const markInteraction = () => {
          userInteracted = true;
        };
        const resetScroll = () => {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body?.scrollTo(0, 0);
        };
        const rejectRestoredFocus = (event) => {
          if (userInteracted) return;
          const target = event.target;
          if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement) {
            target.blur();
            resetScroll();
          }
        };

        window.addEventListener("pointerdown", markInteraction, { capture: true, once: true });
        window.addEventListener("touchstart", markInteraction, { capture: true, once: true });
        window.addEventListener("keydown", markInteraction, { capture: true, once: true });
        document.addEventListener("focusin", rejectRestoredFocus, true);
        window.addEventListener("pageshow", resetScroll);
        window.addEventListener("load", resetScroll);
        window.setTimeout(resetScroll, 0);
        window.setTimeout(resetScroll, 250);
      })();
    </script>
